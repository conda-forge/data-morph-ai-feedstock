schema_version: 1

context:
  name: data-morph-ai
  version: "0.4.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 55bde5af9becb73934bcc25d0f03274536fab72cd09d38c2057371c884a08bfc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - data-morph = data_morph.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatch-vcs
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - matplotlib-base >=3.10.0
    - numpy >=1.23.2
    - pandas >=2.1.0
    - pillow >=12.3.0
    - rich >=13.9.4

tests:
  - python:
      imports:
        - data_morph
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - data-morph --help

about:
  summary: Teaching tool on the importance of data visualization.
  license: MIT
  license_file: LICENSE
  description: |
    Data Morph transforms an input dataset of 2D points into select shapes,
    while preserving the summary statistics to a given number of decimal
    points through simulated annealing. It is intended to be used as a
    teaching tool to illustrate the importance of data visualization.
  homepage: https://stefaniemolin.com/data-morph
  repository: https://github.com/stefmolin/data-morph
  documentation: https://stefaniemolin.com/data-morph

extra:
  recipe-maintainers:
    - stefmolin
